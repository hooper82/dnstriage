services:
  api:
    build: .
    ports:
      - "8080:8080"

  # Stand-in for a real model: random verdicts over the OpenAI API (tests/fake_model.py).
  fake-model:
    image: python:3.12-slim
    command: python /tests/fake_model.py
    volumes:
      - ./tests:/tests:ro
    ports:
      - "8001:8001"
    init: true
    user: nobody
